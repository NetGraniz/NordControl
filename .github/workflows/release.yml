name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build and test plugins
        run: mvn --batch-mode clean verify

      - name: Test Windows UI
        run: dotnet run --project ui/NordControlUi.Tests/NordControlUi.Tests.csproj -c Release

      - name: Publish release files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet publish ui/NordControlUi/NordControlUi.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/ui
          Copy-Item "paper/target/NordControl-Paper-$version.jar" "artifacts/NordControl-Paper-$version.jar"
          Copy-Item "velocity/target/NordControl-Velocity-$version.jar" "artifacts/NordControl-Velocity-$version.jar"
          Copy-Item "artifacts/ui/NordControlUi.exe" "artifacts/NordControlUi-$version-win-x64.exe"
          Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts -File | Select-Object -ExpandProperty FullName
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $files --clobber
          } else {
            gh release create "${{ github.ref_name }}" $files `
              --title "NordControl ${{ github.ref_name }}" `
              --generate-notes
          }
